<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Browser Activity Tracker</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #151823;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --green-bg: #dcfce7;
      --green-text: #166534;
      --red-bg: #fee2e2;
      --red-text: #991b1b;
      --blue-bg: #eef2ff;
      --blue-text: #1e3a8a;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      padding: 16px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(135deg, #111827, #374151);
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.18);
    }

    h1 {
      font-size: 17px;
      margin: 0;
      line-height: 1.1;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 11px 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      background: var(--blue-bg);
      color: var(--blue-text);
    }

    .danger {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .statusLine {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      padding: 7px 0;
      border-bottom: 1px solid #f1f2f4;
    }

    .statusLine:last-child {
      border-bottom: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
      background: var(--green-bg);
      color: var(--green-text);
      white-space: nowrap;
    }

    .pill.off {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .message {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    strong {
      text-align: right;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo"></div>
      <div>
        <h1>Activity Tracker</h1>
        <div class="sub">Chrome / Edge browser time</div>
      </div>
    </div>

    <div id="signedOut" class="card hidden">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

      <label>Password</label>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />

      <button id="signInBtn" class="primary">Sign In</button>
      <div id="signInMessage" class="message"></div>
    </div>

    <div id="signedIn" class="hidden">
      <div class="card">
        <div class="statusLine">
          <span>Signed in</span>
          <strong id="emailText"></strong>
        </div>
        <div class="statusLine">
          <span>Browser</span>
          <strong id="browserText"></strong>
        </div>
        <div class="statusLine">
          <span>Tracking</span>
          <span id="trackingPill" class="pill">On</span>
        </div>
        <div class="statusLine">
          <span>Restrictions</span>
          <span id="restrictionsPill" class="pill off">Off</span>
        </div>
        <div class="statusLine">
          <span>Current site</span>
          <strong id="currentSiteText">—</strong>
        </div>
      </div>

      <div class="card">
        <button id="toggleTrackingBtn" class="secondary">Pause Tracking</button>
        <div style="height: 8px"></div>
        <button id="signOutBtn" class="danger">Sign Out</button>
        <div id="statusMessage" class="message"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
