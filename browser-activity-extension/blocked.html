<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Browser Blocked</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 35%),
        var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .icon {
      width: 70px;
      height: 70px;
      border-radius: 24px;
      background: linear-gradient(135deg, #111827, #374151);
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.04em;
    }

    p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 16px;
      margin: 14px 0 0;
    }

    .small {
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon"></div>
    <h1>Browser access is blocked right now.</h1>
    <p>
      Restrictions are active outside your allowed hours. You can change this from the dashboard.
    </p>
    <div class="small">
      This page updates automatically when browsing is allowed again.
    </div>
  </main>

  <script>
    setInterval(() => {
      location.reload();
    }, 30000);
  </script>
</body>
</html>
